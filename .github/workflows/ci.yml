name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (tags are mutable).
# Dependabot keeps the pins and version comments up to date.

jobs:
  backend:
    name: Backend (lint, types, tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shopflow
          POSTGRES_USER: shopflow
          POSTGRES_PASSWORD: shopflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shopflow -d shopflow"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://shopflow:shopflow@localhost:5432/shopflow
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.test
      # Restricted runtime role: the grant tests connect as it (CI-only credentials).
      DATABASE_APP_ROLE: shopflow_app
      DATABASE_APP_PASSWORD: shopflow_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the restricted app database role
        env:
          PGPASSWORD: shopflow
        run: >-
          psql -h localhost -U shopflow -d shopflow -v ON_ERROR_STOP=1
          -c "CREATE ROLE shopflow_app LOGIN PASSWORD 'shopflow_app' NOSUPERUSER NOCREATEDB NOCREATEROLE"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Type check
        run: uv run mypy .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Production settings pass deploy checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ALLOWED_HOSTS: ci.example.invalid
          DJANGO_ADMIN_URL: ci-admin/
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          JWT_SIGNING_KEYS="ci=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          MFA_ENCRYPTION_KEYS="$(python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          export DJANGO_SECRET_KEY JWT_SIGNING_KEYS JWT_ACTIVE_KEY_ID=ci MFA_ENCRYPTION_KEYS
          uv run python manage.py check --deploy --fail-level WARNING
      - name: Tests
        # -rs lists skipped tests; the DB grant tests must not be skipped in CI.
        run: uv run pytest --cov --cov-report=term -W error -rs
      - name: OpenAPI schema is up to date (shared/openapi.yaml)
        run: |
          uv run python manage.py spectacular --file ../shared/openapi.yaml --validate --fail-on-warn
          git diff --exit-code -- ../shared/openapi.yaml
      - name: Dependency vulnerability audit
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  frontend:
    name: Frontend (lint, types, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Generated API types are up to date
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.d.ts
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      # Gate on runtime dependencies. Dev-only tooling advisories are reviewed
      # through Dependabot instead (see CONTRIBUTING.md).
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: End-to-end + accessibility (Playwright, axe)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack
        run: |
          docker compose up -d --build
          for _ in $(seq 1 90); do curl -sf -o /dev/null http://localhost:3000/login && exit 0; sleep 2; done
          docker compose logs; exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: frontend
        env:
          CI: "true"
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -300

  images:
    name: Container images (build + scan)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          target: runtime
          tags: shopflow-${{ matrix.service }}:${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shopflow-${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
