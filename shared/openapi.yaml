          type: boolean
        description: Only active, or only inactive
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: string
        description: Subcategories of this category ID, or `none` for top-level ones
      - in: query
        name: search
        schema:
          type: string
        description: Part of the name (or code)
      tags:
      - categories
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
