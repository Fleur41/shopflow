            * `CASH` - Cash
            * `CARD` - Card
            * `MOBILE_MONEY` - Mobile money
            * `BANK_TRANSFER` - Bank transfer
            * `OTHER` - Other
        provider:
          $ref: '#/components/schemas/PaymentProvider'
        requires_reference:
          type: boolean
          description: The cashier must enter a reference, e.g. the M-Pesa code.
