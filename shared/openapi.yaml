        schema:
          type: integer
      tags:
      - members
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMemberList'
          description: ''
    post:
      operationId: members_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Unique per operation (e.g. a UUID). Retries with the same key
          return the original response instead of repeating the operation.
      tags:
      - members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCreateRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
  /api/v1/members/{member_id}/:
    get:
      operationId: members_retrieve
      description: Base for every organization-scoped endpoint.
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - members
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
    patch:
      operationId: members_partial_update
      description: Base for every organization-scoped endpoint.
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMemberUpdateRequest'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
  /api/v1/members/{member_id}/reactivate/:
    post:
      operationId: members_reactivate_create
      description: Base for every organization-scoped endpoint.
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
