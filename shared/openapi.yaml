      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
  /api/v1/members/{member_id}/suspend/:
    post:
      operationId: members_suspend_create
      description: Base for every organization-scoped endpoint.
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
  /api/v1/organization/:
    get:
      operationId: organization_retrieve
      description: Base for every organization-scoped endpoint.
      tags:
      - organization
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
