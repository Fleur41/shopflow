          type: boolean
          description: Allow quantities like 0.5 (e.g. kilograms, litres).
        etims_quantity_unit:
          description: |-
            KRA eTIMS unit of quantity, e.g. KG or U (pieces). Needed for eTIMS.

            * `4B` - Pair
            * `AV` - Cap
            * `BA` - Barrel
            * `BE` - Bundle
            * `BG` - Bag
            * `BL` - Block
            * `BLL` - Barrel (petroleum)
            * `BX` - Box
            * `CA` - Can
            * `CEL` - Cell
            * `CMT` - Centimetre
            * `CR` - Carat
            * `DR` - Drum
            * `DZ` - Dozen
            * `GLL` - Gallon
            * `GRM` - Gram
            * `GRO` - Gross
            * `KG` - Kilogram
            * `KTM` - Kilometre
            * `KWT` - Kilowatt
            * `L` - Litre
            * `LBR` - Pound
            * `LK` - Link
            * `LTR` - Litre
            * `M` - Metre
            * `M2` - Square metre
            * `M3` - Cubic metre
            * `MGM` - Milligram
            * `MTR` - Metre
            * `MWT` - Megawatt hour
            * `NO` - Number
            * `NX` - Part per thousand
            * `PA` - Packet
            * `PG` - Plate
            * `PR` - Pair
            * `RL` - Reel
            * `RO` - Roll
            * `SET` - Set
            * `ST` - Sheet
            * `TNE` - Tonne
            * `TU` - Tube
            * `U` - Pieces / items
            * `YRD` - Yard
          oneOf:
          - $ref: '#/components/schemas/EtimsQuantityUnitEnum'
