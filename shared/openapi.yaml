    patch:
      operationId: stores_partial_update
      description: Base for every organization-scoped endpoint.
      parameters:
      - in: path
        name: store_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - stores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStoreUpdateRequest'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreUpdate'
          description: ''
components:
  schemas:
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/SessionInfo'
        tokens:
          allOf:
          - $ref: '#/components/schemas/TokenPair'
          description: Mobile clients only. Web clients receive HttpOnly cookies.
      required:
      - session
      - user
    ClientEnum:
      enum:
      - web
      - mobile
      type: string
      description: |-
        * `web` - web
        * `mobile` - mobile
    ClientTypeEnum:
      enum:
      - WEB
      - MOBILE
      type: string
      description: |-
        * `WEB` - Web browser
        * `MOBILE` - Mobile app
    CsrfToken:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    CurrentAccess:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleSummary'
        permissions:
          type: array
          items:
            type: string
        all_stores:
          type: boolean
        stores:
          type: array
          items:
            $ref: '#/components/schemas/StoreSummary'
      required:
      - all_stores
      - permissions
      - role
      - stores
    EmailVerifyRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - token
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleSummary'
          readOnly: true
        all_stores:
          type: boolean
          readOnly: true
        store_ids:
          readOnly: true
        status:
          type: string
          readOnly: true
        invited_by:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - all_stores
      - created_at
      - email
      - expires_at
      - id
      - invited_by
      - role
      - status
      - store_ids
    InvitationAcceptRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        full_name:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        client:
          allOf:
          - $ref: '#/components/schemas/ClientEnum'
          default: web
      required:
      - token
    InvitationAccepted:
      type: object
      properties:
        organization_id:
          type: string
          format: uuid
      required:
      - organization_id
    InvitationCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        role_id:
          type: string
          format: uuid
        all_stores:
          type: boolean
          default: false
        store_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - email
      - role_id
    InvitationPreview:
      type: object
      properties:
        organization_name:
          type: string
        email:
          type: string
          format: email
        role_name:
          type: string
