openapi: 3.0.3
info:
  title: ShopFlow API
  version: 1.0.0
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Issue the CSRF cookie and return its token for the ``X-CSRFToken``
        header.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/v1/auth/email/verification/:
    post:
      operationId: auth_email_verification_create
      description: Send (again) the link that confirms the signed-in user's email
        address.
      tags:
      - auth
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '202':
          description: Accepted
  /api/v1/auth/email/verify/:
    post:
      operationId: auth_email_verify_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Done
  /api/v1/auth/invitations/accept/:
    post:
      operationId: auth_invitations_accept_create
      description: |-
        Accept an invitation.

        New people send their name and a password: their account is created and
        they are signed in to the business (201). People with an account must be
        signed in as the invited email; they get the business ID to switch to (200).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAccepted'
          description: ''
  /api/v1/auth/invitations/preview/:
    post:
      operationId: auth_invitations_preview_create
      description: What an invitation link is for (the token itself is the credential).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Signed out
  /api/v1/auth/logout-all/:
    post:
      operationId: auth_logout_all_create
      tags:
      - auth
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: All sessions ended
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: The signed-in user, the current business and what they may do in
        it.
      tags:
      - auth
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/mfa/totp/confirm/:
    post:
      operationId: auth_mfa_totp_confirm_create
      description: Confirm with a first code. Returns recovery codes once; other sessions
        end.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TOTPConfirmRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
          description: ''
  /api/v1/auth/mfa/totp/disable/:
    post:
      operationId: auth_mfa_totp_disable_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TOTPDisableRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Done
  /api/v1/auth/mfa/totp/setup/:
    post:
      operationId: auth_mfa_totp_setup_create
      description: 'Start authenticator-app setup: returns the secret and a QR code
        to scan.'
      tags:
      - auth
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPSetup'
          description: ''
  /api/v1/auth/mfa/verify/:
    post:
      operationId: auth_mfa_verify_create
      description: 'Second sign-in step after ``401 MFA_REQUIRED``: a 6-digit or recovery
        code.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Done
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: Always 202, whether or not the address has an account.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          description: Accepted
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Done
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Web clients send no body; the refresh token comes from the cookie.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/sessions/:
    get:
      operationId: auth_sessions_list
      description: 'The caller''s active sessions; the one making the request has
        ``current: true``.'
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - auth
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSessionList'
          description: ''
  /api/v1/auth/sessions/{session_id}/:
    delete:
      operationId: auth_sessions_destroy
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Session revoked
  /api/v1/auth/signup/:
    post:
      operationId: auth_signup_create
      description: Create an account and a business in one step; the caller is signed
        in as its owner.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/switch-organization/:
    post:
      operationId: auth_switch_organization_create
      description: Start a new session in another of the user's businesses (the old
        one ends).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchOrganizationRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/brands/:
    get:
      operationId: brands_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Only active, or only inactive
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Part of the name (or code)
      tags:
      - brands
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBrandList'
          description: ''
    post:
      operationId: brands_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Unique per operation (e.g. a UUID). Retries with the same key
          return the original response instead of repeating the operation.
      tags:
      - brands
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
          description: ''
  /api/v1/brands/{entry_id}/:
    get:
      operationId: brands_retrieve
      description: Base for every organization-scoped endpoint.
      parameters:
      - in: path
        name: entry_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - brands
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
          description: ''
    patch:
      operationId: brands_partial_update
      description: Base for every organization-scoped endpoint.
      parameters:
      - in: path
        name: entry_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - brands
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBrandUpdateRequest'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
          description: ''
  /api/v1/categories/:
    get:
