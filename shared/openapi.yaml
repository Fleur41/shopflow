components:
  schemas:
    Adjustment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        client_txn_id:
          type: string
          format: uuid
          readOnly: true
        reason_code:
          allOf:
          - $ref: '#/components/schemas/AdjustmentReasonCodeEnum'
          readOnly: true
        note:
          type: string
          readOnly: true
        created_by:
          type: string
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/AdjustmentLine'
      required:
      - client_txn_id
      - created_at
      - created_by
      - id
      - lines
      - note
      - occurred_at
      - reason_code
    AdjustmentCreateReasonCodeEnum:
      enum:
      - COUNT_CORRECTION
      - DAMAGED
      - EXPIRED
      - THEFT_LOSS
      - FOUND
      - OTHER
      type: string
      description: |-
        * `COUNT_CORRECTION` - Stock count
        * `DAMAGED` - Damaged
        * `EXPIRED` - Expired
        * `THEFT_LOSS` - Theft or loss
        * `FOUND` - Found
        * `OTHER` - Other
    AdjustmentCreateRequest:
      type: object
      properties:
        client_txn_id:
          type: string
          format: uuid
        reason_code:
          $ref: '#/components/schemas/AdjustmentCreateReasonCodeEnum'
        note:
          type: string
          default: ''
          maxLength: 500
        occurred_at:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/_AdjustmentLineInputRequest'
      required:
      - client_txn_id
      - lines
      - reason_code
    AdjustmentLine:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/_ProductRef'
        quantity_delta:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        counted_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
          description: Set when the line came from a count.
      required:
      - counted_quantity
      - product
      - quantity_delta
    AdjustmentReasonCodeEnum:
      enum:
      - OPENING_BALANCE
      - COUNT_CORRECTION
      - DAMAGED
      - EXPIRED
      - THEFT_LOSS
      - FOUND
      - OTHER
      type: string
      description: |-
        * `OPENING_BALANCE` - Opening stock
        * `COUNT_CORRECTION` - Stock count
        * `DAMAGED` - Damaged
        * `EXPIRED` - Expired
        * `THEFT_LOSS` - Theft or loss
        * `FOUND` - Found
        * `OTHER` - Other
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/SessionInfo'
        tokens:
          allOf:
          - $ref: '#/components/schemas/TokenPair'
          description: Mobile clients only. Web clients receive HttpOnly cookies.
      required:
      - session
      - user
    BlankEnum:
      enum:
      - ''
    Brand:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        is_active:
          type: boolean
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
      - version
    BrandRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        is_active:
          type: boolean
      required:
      - name
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        parent:
          type: string
          format: uuid
          nullable: true
        is_active:
          type: boolean
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
