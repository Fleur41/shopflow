        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - stores
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStoreList'
          description: ''
    post:
      operationId: stores_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Unique per operation (e.g. a UUID). Retries with the same key
          return the original response instead of repeating the operation.
      tags:
      - stores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
