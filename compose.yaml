# Local development environment. Not for production use.
# Usage: `make up` (or `docker compose up --build`), then open http://localhost:3000
name: shopflow

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shopflow
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopflow}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-shopflow_app}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopflow -d shopflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    # Catches all outgoing email locally: http://localhost:8025
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

  backend:
    build:
      context: ./backend
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      # The app runs as the restricted role; migrations and tests use the owner.
      DATABASE_URL: postgres://shopflow_app:${POSTGRES_APP_PASSWORD:-shopflow_app}@db:5432/shopflow
      MIGRATION_DATABASE_URL: postgres://shopflow:${POSTGRES_PASSWORD:-shopflow}@db:5432/shopflow
      TEST_DATABASE_URL: postgres://shopflow:${POSTGRES_PASSWORD:-shopflow}@db:5432/shopflow
      DATABASE_APP_ROLE: shopflow_app
      DATABASE_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-shopflow_app}
      REDIS_URL: redis://redis:6379/0
      EMAIL_URL: smtp://mailpit:1025
      FRONTEND_URL: http://localhost:3000
      MEDIA_ROOT: /data/media
      MEDIA_URL: http://localhost:8000/media/
    command: >-
      sh -c "DATABASE_URL=$$MIGRATION_DATABASE_URL python manage.py migrate --noinput
      && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - ./shared:/shared
      - media:/data/media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      API_INTERNAL_URL: http://backend:8000
      # Product images come straight from Django's port: a separate origin.
      MEDIA_ORIGIN: http://localhost:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - ./shared:/shared:ro
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
